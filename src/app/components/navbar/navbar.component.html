<nav class="bg-white shadow-md border-b border-gray-200 fixed top-0 left-0 w-full z-50">
    <div class="max-w-screen-xl flex flex-wrap items-center justify-between mx-auto p-4">
        
        <!-- Left Section: Logo & Navigation -->
        <div class="flex items-center md:flex md:items-center md:space-x-8 md:order-1 flex-grow">
            <a routerLink="/" class="flex items-center space-x-3 rtl:space-x-reverse">
                <img src="assests/logo.jpg" class="h-9 w-9 rounded-full object-cover" alt="GOVocal Logo" />
                <span class="self-center text-lg font-semibold whitespace-nowrap text-gray-900">GOVocal</span>
            </a>
  
            <!-- Navigation Links for Large Screens -->
            <ul class="hidden md:flex md:flex-row md:space-x-8">
                <li><a routerLink="/" class="block py-2 text-gray-900 hover:text-teal-900">Home</a></li>
                <li><a routerLink="/" class="block py-2 text-gray-900 hover:text-teal-900">Projects</a></li>
                <li><a routerLink="/discussion" class="block py-2 text-gray-900 hover:text-teal-900">Proposals</a></li>
                <li><a routerLink="/" class="block py-2 text-gray-900 hover:text-teal-900">Events</a></li>
                <li><a routerLink="/issue-page" class="block py-2 text-gray-900 hover:text-teal-900">Reportings</a></li>
                <li><a routerLink="/contact-us" class="block py-2 text-gray-900 hover:text-teal-900">FAQ</a></li>
            </ul>
        </div>
  
        <!-- Mobile Menu Button -->
        <button class="md:hidden text-gray-900 focus:outline-none" (click)="toggleMenu()">
            <svg class="w-6 h-6" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16m-7 6h7" />
            </svg>
        </button>
  
        <!-- Mobile Menu -->
        <ul [ngClass]="{'hidden': !isMenuOpen, 'flex': isMenuOpen}" 
            class="flex-col md:hidden absolute top-16 left-0 bg-white w-full shadow-md p-4">
            <li><a href="#" class="block py-2 text-gray-900 hover:text-teal-700">Home</a></li>
            <li><a href="#" class="block py-2 text-gray-900 hover:text-teal-700">Projects</a></li>
            <li><a routerLink="/discussion" class="block py-2 text-gray-900 hover:text-teal-700">Proposals</a></li>
            <li><a href="#" class="block py-2 text-gray-900 hover:text-teal-700">Events</a></li>
            <li><a routerLink="/issue-page" class="block py-2 text-gray-900 hover:text-teal-700">Reportings</a></li>
            <li><a href="#" class="block py-2 text-gray-900 hover:text-teal-700">FAQ</a></li>
        </ul>
  
        <!-- Right Section: User Login/Register -->
        <div class="flex md:order-1">
            <div *ngIf="!user; else loggedInTemplate" class="flex space-x-4">
                <button class="px-6 py-2 text-gray-900 font-medium border border-gray-300 rounded-full bg-gray-100 hover:bg-gray-200" routerLink="/login">
                    Sign in
                </button>
                <button class="px-6 py-2 text-white font-medium rounded-full bg-teal-900 hover:bg-teal-800" routerLink="/register">
                    Register
                </button>
            </div>
  
            <!-- Show Username & Log out when LOGGED IN -->
            <ng-template #loggedInTemplate>
                <div class="flex items-center space-x-4">
                    <span class="text-gray-900 font-medium cursor-pointer">Hello, {{ username }}</span>
                    <button (click)="logout()" class="px-6 py-2 text-white font-medium rounded-full bg-gray-600 hover:bg-gray-700">
                        Log out
                    </button>
                </div>
            </ng-template>
        </div>
    </div>
  </nav>
