<!-- Navbar -->
<app-navbar class="fixed top-0 w-full z-50 bg-white shadow-md"></app-navbar>

<!-- Main Container -->
<div class="container mx-auto flex flex-col lg:flex-row h-screen pt-16">
  <!-- Left Section -->
  <div class="left-section w-full lg:w-1/2 flex flex-col justify-center items-center lg:items-start px-6 lg:px-16">
    <h1 class="text-sm lg:text-2xl font-bold text-gray-800 mb-1">One Login</h1>
    <p class="text-gray-600 text-sm lg:text-base mb-6">All Government Services</p>

    <!-- Form -->
    <form class="w-full max-w-md" (ngSubmit)="onLogin()">
      <!-- Email Input -->
      <label for="email" class="block text-sm font-medium text-gray-700 mb-1">Email address *</label>
      <input
        id="email"
        type="email"
        [(ngModel)]="email"
        name="email"
        class="w-full p-2 border border-gray-300 outline-none rounded-md mb-4 focus:ring-2 focus:ring-teal-800 focus:border-teal-500"
        placeholder="Enter your email"
      />

      <!-- Password Input -->
      <label for="password" class="block text-sm font-medium text-gray-700 mb-1">Password *</label>
      <div class="relative mb-4">
        <input
          id="password"
          [type]="showPassword ? 'text' : 'password'"
          [(ngModel)]="password"
          name="password"
          class="w-full p-2 border border-gray-300 outline-none rounded-md focus:ring-2 focus:ring-teal-800 focus:border-teal-500"
          placeholder="Password"
        />
        <button
          type="button"
          (click)="togglePasswordVisibility()"
          class="absolute right-3 top-1/2 transform -translate-y-1/2 text-gray-700 text-xl"
        >
          <i class="pi" [ngClass]="showPassword ? 'pi-eye-slash' : 'pi-eye'"></i>
        </button>
      </div>

      <!-- Additional Options -->
      <div class="flex justify-between items-center mb-6">
        <label class="flex items-center text-sm text-gray-600 space-x-2">
          <input type="checkbox" [(ngModel)]="rememberMe" name="rememberMe" class="rounded border-gray-300" />
          <span class="text-sm text-gray-600 whitespace-nowrap">Remember for 30 days</span>
        </label>
        <a href="#" class="text-teal-800 text-xs font-medium hover:underline">Forgot Password</a>
      </div>

      <!-- Sign In Button -->
      <button type="submit" class="w-full py-2 bg-teal-900 text-white rounded-md text-sm font-medium hover:bg-teal-800">
        Sign In
      </button>
    </form>

    <!-- Sign Up Link -->
    <p class="mt-4 text-gray-600 text-sm font-medium">
      Don’t have an account?
      <a [routerLink]="['/register']" class="text-teal-900 font-medium hover:underline text-sm">Sign up</a>
    </p>
  </div>

  <!-- Right Section -->
  <div class="right-section w-full lg:w-1/2 relative">
    <img
      src="assests/login.jpg"
      alt="Illustration"
      class="w-full h-full object-cover"
    />
    <div class="absolute bottom-8 left-8 bg-black bg-opacity-60 text-white p-4 rounded-md max-w-sm">
      <p class="text-sm leading-5">
        Over <span class="font-extrabold">8,000</span> Government services now available at your fingertips
      </p>
    </div>
  </div>
</div>

<!-- Full-Page Loading Spinner (Blur Effect) -->
<div *ngIf="isLoading" class="overlay">
  <mat-spinner color="primary"></mat-spinner>
</div>
