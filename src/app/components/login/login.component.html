<div class="container">
  <div class="left-section">
    <div class="logo">
      <img src="assets/image.png" alt="Logo" class="logo-img" />
    </div>
    <h1>One Login</h1>
    <p>All Government Services</p>
    <form (ngSubmit)="onSubmit()">
      <label for="email">Email address or ID number *</label>
      <input
        id="email"
        type="text"
        [(ngModel)]="email"
        name="email"
        required
        placeholder="Enter your email or ID number"
      />

      <label for="password">Password *</label>
      <input
        id="password"
        type="password"
        [(ngModel)]="password"
        name="password"
        required
        placeholder="Password"
      />
      <div class="remember-section">
        <label>
          <input type="checkbox" [(ngModel)]="rememberMe" name="rememberMe" />
          Remember for 30 days
        </label>
        <a href="#" class="forgot-password">Forgot Password</a>
      </div>
      <button type="submit" class="btn btn-primary">Sign In</button>
    </form>
    <div class="alt-signin">
      <p>Or continue with</p>
      <button class="btn btn-secondary">Sign in with Digital ID</button>
    </div>
    <p class="signup">
      Don’t have an account? <a href="#" class="signup-link">Sign up</a>
    </p>
  </div>
  <div class="right-section">
    <img src="assets/image.png" alt="Illustration" class="right-img" />
    <div class="overlay">
      <p>Over 8,000 Government services now available at your fingertips</p>
    </div>
  </div>
</div>
