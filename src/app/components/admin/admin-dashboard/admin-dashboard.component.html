<main>
  <app-sidebar (selectSection)="onSectionSelected($event)"></app-sidebar>
  <div class="dashboard-container">
    <!-- Main content goes here -->
     <app-dashboard *ngIf=" selectedSection === 'dashboard'"></app-dashboard>
     <app-projects *ngIf="selectedSection === 'projects'"></app-projects>
     <app-events *ngIf="selectedSection === 'events'"></app-events>
     <app-users *ngIf="selectedSection === 'users'"></app-users>
  </div>
</main>
