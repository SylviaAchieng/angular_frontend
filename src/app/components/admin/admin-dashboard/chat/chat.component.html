<div class="flex h-screen bg-gray-100">
    <!-- Sidebar -->
    <div class="w-1/3 bg-white border-r border-gray-300 flex flex-col">
      <div class="p-3 border-b">
        <input 
          type="text" 
          placeholder="Search order, user" 
          class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-teal-900"
        />
      </div>
  
      <div class="flex-1 overflow-y-auto">
        <div 
          *ngFor="let chat of chats" 
          (click)="selectChat(chat)" 
          class="p-4 border-b cursor-pointer hover:bg-gray-200"
          [ngClass]="{'bg-gray-300': selectedChat?.id === chat.id}"
        >
          <div class="flex items-center space-x-3">
            <img [src]="chat.avatar" class="w-10 h-10 rounded-full" />
            <div class="flex-1">
              <h3 class="text-sm font-semibold">{{ chat.title }}</h3>
              <p class="text-xs text-gray-600 truncate">{{ chat.message }}</p>
            </div>
            <span class="text-xs text-gray-400">{{ chat.date }}</span>
          </div>
        </div>
      </div>
    </div>
  
    <!-- Chat Window -->
    <div class="w-2/3 flex flex-col">
      <div class="p-4 bg-white border-b flex items-center justify-between">
        <h3 class="text-lg font-semibold">{{ selectedChat?.title || 'Select a chat' }}</h3>
      </div>
  
      <div class="flex-1 overflow-y-auto p-4 space-y-4">
        <div *ngFor="let msg of chatMessages" [ngClass]="{'text-right': msg.fromMe}">
          <div class="inline-block max-w-xs px-4 py-2 rounded-lg" 
            [ngClass]="msg.fromMe ? 'bg-teal-900 text-white' : 'bg-gray-200 text-black'">
            {{ msg.text }}
          </div>
          <p class="text-xs text-gray-500 mt-1">{{ msg.time }}</p>
        </div>
      </div>
  
      <div class="p-4 border-t flex items-center bg-white">
        <input type="text" [(ngModel)]="newMessage" 
          placeholder="Type a message here" 
          class="flex-1 px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-teal-800">
        <button (click)="sendMessage()" 
          class="ml-3 px-4 py-2 bg-teal-900 text-white rounded-lg">Send</button>
      </div>
    </div>
  </div>
