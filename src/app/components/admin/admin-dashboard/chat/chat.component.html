      <!--User table-->
      <div class="font-[sans-serif] overflow-x-auto">
        <table value="events" class="min-w-full bg-white">
          <thead class="bg-teal-900 text-white">
            <tr>
              <th class="p-4 text-left text-sm font-semibold">
                <i class="pi pi-id-card mr-1"></i>FullName
              </th>
              <th class="p-4 text-left text-sm font-semibold">
                <i class="pi pi-envelope mr-1"></i>Email
              </th>
              <th class="p-4 text-left text-sm font-semibold">
                <i class="pi pi-align-left mr-1"></i>Message
              </th>
              <th class="p-4 text-left text-sm font-semibold">
                <i class="pi pi-map-marker mr-1"></i>Location
              </th>
              <th class="p-4 text-left text-sm font-semibold">
                <i class="pi pi-info-circle mr-1"></i>Details
              </th>
            </tr>
          </thead>
          <tbody class="whitespace-nowrap divide-y divide-gray-200">
            <tr *ngFor="let message of chats">
              <td class="p-4 text-sm text-black">
                {{ message?.fullName }}
              </td>
              <td class="p-4 text-sm text-black">
                  {{ message?.email }}
                </td>
              <td class="p-4 text-sm text-black">
                {{ message?.message.slice(0, 50) }}
              </td>
              <td class="p-4 text-sm text-black">
                {{ message?.location?.county }}
              </td>
              <td class="p-4 text-sm text-center">
                <button (click)="showViewEventModal(message)" class="bg-gray-500 text-white py-1 px-3 rounded-md hover:bg-gray-500">
                  <i class="pi pi-eye"></i> View
                </button>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    
      <!-- View User Modal-->
      <div *ngIf="isViewing" class="fixed inset-0 z-50 flex items-center justify-center bg-black bg-opacity-50">
        <div class="bg-white p-6 rounded-md shadow-md relative w-full max-w-3xl mx-auto">
          <div class="flex justify-between items-center mb-4">
            <h2 class="text-xl font-semibold">Message Details</h2>
            <button (click)="closeViewEventModal()" class="text-gray-500 hover:text-gray-700">
              <i class="pi pi-times"></i>
            </button>
          </div>
          <div class="flex">
            <div class="w-2/3 pr-4">
              <div class="mb-4 flex items-center">
                <i class="pi pi-tag mr-2"></i>
                <div>
                  <label class="text-sm font-medium">FullName:</label>
                  <input type="text" [(ngModel)]="selectedMessage.fullName" class="border rounded p-2 w-full" />
                </div>
              </div>
              <div class="mb-4 flex items-center">
                <i class="pi pi-envelope mr-2"></i>
                <div>
                  <label class="text-sm font-medium">Email:</label>
                  <input type="email" [(ngModel)]="selectedMessage.email" class="border rounded p-2 w-full" />
                </div>
              </div>
              <div class="mb-4 flex items-center">
                  <i class="pi pi-users mr-2"></i>
                  <div>
                    <label class="text-sm font-medium">Message:</label>
                    <textarea type="text" [(ngModel)]="selectedMessage.message" class="border rounded p-2 w-full"></textarea>
                  </div>
                </div>
                <div class="mb-4 flex items-center">
                  <i class="pi pi-tag mr-2"></i>
                  <div>
                    <label class="text-sm font-medium">Date:</label>
                    <input type="date" [(ngModel)]="selectedMessage.date" class="border rounded p-2 w-full" />
                  </div>
                </div>
              <div class="mb-4 flex items-center">
                <i class="pi pi-map-marker mr-2"></i>
                <div>
                  <label class="text-sm font-medium">Location:</label>
                  <input type="text" [(ngModel)]="selectedMessage.location.county" class="border rounded p-2 w-full" />
                </div>
              </div>
            </div>
          </div>
          <div class="flex justify-end mt-4 gap-4">
            <button (click)="closeViewEventModal()" class="bg-gray-500 text-white py-2 px-4 rounded-md hover:bg-gray-500">
              <i class="pi pi-times mr-2"></i> Close
            </button>
            <button  class="bg-gray-500 text-white py-2 px-4 rounded-md hover:bg-gray-500">
              <i class="pi pi-check mr-2"></i> Update
            </button>
            <button class="bg-gray-500 text-white py-2 px-4 rounded-md hover:bg-gray-500">
              <i class="pi pi-trash mr-2"></i> Delete
            </button>
          </div>
        </div>
      </div> 
    </div>
