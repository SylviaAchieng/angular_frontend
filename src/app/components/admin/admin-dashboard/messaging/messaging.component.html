        <div class="ml-auto flex items-center">
          <button class="mr-2">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" />
            </svg>
          </button>
          <button>
            <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 5v.01M12 12v.01M12 19v.01M12 6a1 1 0 110-2 1 1 0 010 2zm0 7a1 1 0 110-2 1 1 0 010 2zm0 7a1 1 0 110-2 1 1 0 010 2z" />
            </svg>
          </button>
        </div>
      </div>
    </div>

    <div class="flex-grow overflow-y-auto p-4 px-16">
        <div *ngFor="let message of messages" class="mb-2">
            <div [ngClass]="{'flex justify-end': message.sender === 'user'}">
                <div class="bg-white rounded-lg px-8 max-w-xs">
                    <p class="text-sm">{{ message.content }}</p>
                    <p class="text-xs text-gray-500">{{ message.timestamp }}</p>
                </div>
            </div>
        </div>
        <div class="flex justify-center" *ngIf="isTyping">
            <p class="text-sm text-gray-500">Typing...</p>
        </div>
    </div>
    <div class="bg-white p-4 border-t">
      <div class="flex">
        <input type="text" [(ngModel)]="newMessage" placeholder="Type a message..." class="flex-grow border rounded-l-md p-2 focus:outline-none">
        <button (click)="sendMessage()" class="bg-[#0d3b50] hover:bg-green-900 text-white rounded-r-md p-2">Send</button>
      </div>
    </div>
  </div>
