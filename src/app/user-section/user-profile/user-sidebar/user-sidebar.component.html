
  <div class="h-screen w-64 bg-[#0d3b50] text-white fixed flex flex-col">
    <!-- Top Section -->
    <div [routerLink]="['/']" class="p-4 flex items-center gap-2 bg-[#1a5d76] cursor-pointer">
      <i class="fa-solid fa-arrow-left"></i>
      <span class="font-semibold">To platform</span>
    </div>

    <div class="text-center mt-4">
        <img [src]="user.avatar" alt="User Avatar" class="w-20 h-20 rounded-full mx-auto">
        <h2 class="text-xl font-bold mt-2">{{ user.name }}</h2>
        <p class="text-sm opacity-75">{{ user.role }}</p>
        <span class="text-green-400 text-sm" *ngIf="user.online">● Online</span>
      </div>
  
    <!-- Navigation Links -->
    <nav class="flex-1 mt-8  mx-auto">
      <ul>
        <li class="px-16 py-2 bg-[#1a5d76] flex items-center gap-3 cursor-pointer">
          <a [routerLink]="['/profile/user-profile']" class="w-full flex items-center gap-3">
            <i class="fas fa-chart-line"></i> Dashboard
          </a>
        </li>
        <li class="px-16 py-2 hover:bg-[#1a5d76]flex items-center gap-3 cursor-pointer">
          <i class="fas fa-envelope"></i> Messaging
        </li>
        <li [routerLink]="['/profile/report-issue']" class="px-16 py-2 hover:bg-[#1a5d76] flex items-center gap-3 cursor-pointer">
          <i class="fas fa-chart-bar"></i> Reporting
        </li>
        <li [routerLink]="['/profile/profile-settings']" class="px-16 py-2 hover:bg-[#1a5d76] flex items-center gap-3 cursor-pointer">
            <i class="fas fa-cog"></i> Settings
          </li>
          <li [routerLink]="['/profile/privacy-policy']" class="px-16 py-2 hover:bg-[#1a5d76] flex items-center gap-3 cursor-pointer">
            <i class="fas fa-user-shield"></i> Privacy
          </li>
          <li class="px-16 py-2 hover:bg-[#1a5d76] flex items-center gap-3 cursor-pointer relative">
            <i class="fas fa-bell"></i> Notifications
            <span class="bg-red-500 text-xs px-2 rounded-full absolute right-4">2</span>
          </li>
      </ul>
    </nav>
  
    <!-- User Profile -->
    <div class="mt-auto p-4 flex items-center gap-3 cursor-pointer hover:bg-[#1a5d76]">
      <div class="w-8 h-8 bg-gradient-to-r from-purple-500 to-blue-500 rounded-full"></div>
      <div>
        <p class="text-sm font-semibold">{{user}}</p>
        <p class="text-xs text-gray-300">Administrator</p>
      </div>
    </div>
  </div>
