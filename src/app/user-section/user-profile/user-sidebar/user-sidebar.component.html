
  <div class="h-screen w-64 bg-[#0d3b50] text-white fixed flex flex-col">
    <!-- Top Section -->
    <div [routerLink]="['/']" class="p-4 flex items-center gap-2 bg-[#1a5d76] cursor-pointer">
      <i class="fa-solid fa-arrow-left"></i>
      <span class="font-semibold">To platform</span>
    </div>

    <div class="text-center mt-4 flex">
      <img [src]="profileImage || 'assests/avatar.jpg'" alt="Profile" class="w-20 h-20 rounded-full border" />
        <div class="flex flex-col items-start justify-center ml-2">
        <h2 class="text-xl font-bold">{{ userData?.fullName }}</h2>
        <p class="text-sm opacity-75">{{ userData?.userType }}</p>
        <!-- <span class="text-green-400 text-sm" *ngIf="user.online">Online ●</span> -->
      </div>
      </div>
  
    <!-- Navigation Links -->
    <nav class="flex-1 mt-8">
      <ul>
        <li class=" p-2 bg-[#1a5d76] flex items-center gap-3 cursor-pointer">
          <a [routerLink]="['/profile/user-profile']" class="w-full flex items-center gap-3">
            <i class="fas fa-chart-line"></i> Dashboard
          </a>
        </li>
        <li class=" p-2 hover:bg-[#1a5d76]flex items-center gap-3 cursor-pointer">
          <i class="fas fa-envelope"></i> Messaging
        </li>
        <li [routerLink]="['/profile/report-issue']" class="p-2 hover:bg-[#1a5d76] flex items-center gap-3 cursor-pointer">
          <i class="fas fa-chart-bar"></i> Reporting
        </li>
        <li [routerLink]="['/profile/profile-settings']" class="p-2 hover:bg-[#1a5d76] flex items-center gap-3 cursor-pointer">
            <i class="fas fa-cog"></i> Settings
          </li>
          <li [routerLink]="['/profile/privacy-policy']" class="p-2 hover:bg-[#1a5d76] flex items-center gap-3 cursor-pointer">
            <i class="fas fa-user-shield"></i> Privacy
          </li>
          <li [routerLink]="['/profile/user-notifications']" class=" p-2 hover:bg-[#1a5d76] flex items-center gap-3 cursor-pointer relative">
            <i class="fas fa-bell"></i> Notifications
            <span class="bg-red-500 text-xs px-2 rounded-full absolute right-4">{{pendingNotificationsCount}}</span>
          </li>
      </ul>
    </nav>
  
    <!-- User Profile -->
     <div class="border-t border-gray-600">
    <div class="mt-auto p-4 flex items-center gap-3 cursor-pointer hover:bg-[#1a5d76]">
      <div class="w-8 h-8 bg-gradient-to-r from-purple-500 to-blue-500 rounded-full"></div>
      <div>
        <p class="text-sm font-semibold">GOVocal</p>
        <p class="text-xs text-gray-300">Citizen</p>
      </div>
    </div>
  </div>
  </div>
