<header class="flex items-center justify-between py-2 mb-6 bg-[#0b0359] text-white shadow-md rounded-lg px-6">
    <!-- Left Section: Message & Notification Icons -->
    <div class="flex space-x-4">
      <button class="relative bg-white p-2 rounded-full shadow">
        <i class="fas fa-envelope text-[#0b0359]"></i>
      </button>
      <button class="relative bg-white p-2 rounded-full shadow">
        <i class="fas fa-bell text-[#0b0359]"></i>
        <span class="absolute -top-1 -right-1 bg-red-500 text-white text-xs px-1 rounded-full">3</span>
      </button>
    </div>
  
    <!-- Center Section: Search Bar -->
    <div class="flex items-center bg-white rounded-full px-4 py-2 w-80 shadow">
      <i class="fas fa-search text-gray-500 mr-2"></i>
      <input 
        type="text" 
        placeholder="Search issues" 
        class="w-full text-black focus:outline-none"
      />
    </div>
  
    <!-- Right Section: Menu Icon -->
    <button class="bg-white p-2 rounded-full shadow">
      <i class="fas fa-bars text-[#0b0359]"></i>
    </button>
  </header>

<div class="grid grid-cols-1 md:grid-cols-3 gap-6 mt-4">
  <div class="bg-white p-6 shadow rounded-lg flex items-center">
    <i class="fas fa-chart-bar text-[#0b0359] text-3xl"></i>
    <div class="ml-4">
      <h2 class="text-gray-600 text-sm">Pending Issues</h2>
      <p class="text-xl font-semibold">{{  pendingIssuesCount}}</p>
    </div>
  </div>
  <div class="bg-white p-6 shadow rounded-lg flex items-center">
    <i class="fas fa-chart-bar text-[#0b0359] text-3xl"></i>
    <div class="ml-4">
      <h2 class="text-gray-600 text-sm">Inprogress Issues</h2>
      <p class="text-xl font-semibold">{{ inProgressIssuesCount}}</p>
    </div>
  </div>
  <div class="bg-white p-6 shadow rounded-lg flex items-center">
    <i class="fas fa-chart-bar text-[#0b0359] text-3xl"></i>
    <div class="ml-4">
      <h2 class="text-gray-600 text-sm">Resolved Issues</h2>
      <p class="text-xl font-semibold">{{ resolvedIssuesCount}}</p>
    </div>
  </div>
</div>



<div class="mt-6 bg-white p-6 shadow rounded-lg">
  <h2 class="text-lg font-semibold text-gray-700 mb-4">Issues List</h2>
  <div class="font-[sans-serif] overflow-x-auto">
    <table value="events" class="min-w-full bg-white">
      <thead class="bg-[#0b0359] text-white">
        <tr>
          <th class="p-4 text-left text-sm font-semibold">
            <i class="pi pi-image mr-1"></i>Banner
          </th>
          <th class="p-4 text-left text-sm font-semibold">
            <i class="pi pi-tag mr-1"></i>Title
          </th>
          <th class="p-4 text-left text-sm font-semibold">
            <i class="pi pi-align-left mr-1"></i>Description
          </th>
          <th class="p-4 text-left text-sm font-semibold">
            <i class="pi pi-calendar mr-1"></i>Status
          </th>
          <th class="p-4 text-left text-sm font-semibold">
            <i class="pi pi-info-circle mr-1"></i>Details
          </th>
        </tr>
      </thead>
      <tbody class="whitespace-nowrap divide-y divide-gray-200">
        <tr *ngFor="let issue of issues">
          <td class="p-4 text-sm">
            <div class="flex items-center">
              <img [src]="issue?.base64EncodedImage || 'assests/home.jpg'" class="w-24 h-24 p-1.5 shrink-0 bg-gray-100" />
            </div>
          </td>
          <td class="p-4 text-sm text-black">
            {{ issue?.title }}
          </td>
          <td class="p-4 text-sm text-black">
            {{ issue?.description}}
          </td>
          <td class="p-4 text-sm text-black">
            {{ issue?.status }}
          </td>
          <td class="p-4 text-sm text-center">
            <button class="bg-gray-500 text-white py-1 px-3 rounded-md hover:bg-gray-600">
              <i class="pi pi-eye"></i> View
            </button>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
