<!-- Navbar -->
<div class="w-full bg-white shadow-md px-6 py-3 flex items-center justify-between fixed top-0 left-0 right-0 z-50">
    <!-- Search Bar -->
    <div class="relative w-1/3">
      <input type="text" placeholder="Search" class="w-full px-3 py-2 bg-gray-100 text-black rounded-md focus:outline-none focus:ring-2 focus:ring-[#1a5d76]">
    </div>
  
    <!-- Right Section: Notifications & Profile -->
    <div class="flex items-center gap-6">
      <!-- Notification Icon -->
      <div class="relative cursor-pointer">
        <i class="fas fa-bell text-xl"></i>
        <span class="absolute -top-1 -right-1 bg-red-500 text-xs px-2 rounded-full">2</span>
      </div>
  
      <!-- Profile Dropdown -->
      <div class="flex items-center gap-2 cursor-pointer">
        <img [src]="user.avatar" alt="User Avatar" class="w-8 h-8 rounded-full">
        <span class="font-medium">{{ user.name }}</span>
        <i class="fas fa-chevron-down text-gray-500"></i>
      </div>
    </div>
  </div>
