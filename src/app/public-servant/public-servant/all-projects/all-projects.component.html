<div class="container mx-auto px-6 py-6">

    <div class="flex justify-end mb-4">
      <button (click)="toggleProjectForm()" class="bg-teal-900 text-white py-2 px-4 rounded-md shadow-md hover:bg-teal-800 transition">
        <i class="pi pi-plus mr-2"></i> Create Project
      </button>
    </div>
  
      <!-- Navbar -->
      <nav class="flex items-center justify-between py-2 mb-4 bg-teal-900 text-white shadow-md rounded-lg">
        <div class="flex items-center text-xl font-medium px-4">
          <i class="pi pi-file-check mr-2"></i>Projects
        </div>
      </nav>
  
  
      <!-- Add Project Form -->
      <div *ngIf="isProjectFormVisible" class="bg-white p-6 rounded-md shadow-md mb-4 border border-gray-300 transition-all">
        <h2 class="text-lg font-semibold mb-4 text-primary">Create New Project</h2>
        <form (ngSubmit)="createProject()">
          <!-- Title -->
          <div class="mb-4">
            <label class="block text-sm font-medium text-gray-700">Title:</label>
            <input type="text" [(ngModel)]="newProject.title" name="title" required class="w-full p-2 border rounded-md">
          </div>
          <!-- Location 
          <div class="mb-4">
            <label class="block text-sm font-medium text-gray-700">Location:</label>
            <input type="text" [(ngModel)]="newEvent.location.county" name="county" required class="w-full p-2 border rounded-md">
          </div>-->
          <!-- Description -->
          <div class="mb-4">
            <label class="block text-sm font-medium text-gray-700">Description:</label>
            <textarea [(ngModel)]="newProject.description" name="description" required class="w-full p-2 border rounded-md"></textarea>
          </div>
          <!-- time -->
          <div class="mb-4">
            <label class="block text-sm font-medium text-gray-700">Start Date:</label>
            <input type="date" [(ngModel)]="newProject.startDate" name="startDate" required class="w-full p-2 border rounded-md">
          </div>
          <div class="mb-4">
            <label class="block text-sm font-medium text-gray-700">End Date:</label>
            <input type="date" [(ngModel)]="newProject.endDate" name="endDate" required class="w-full p-2 border rounded-md">
          </div>
          <div class="mb-4">
            <label class="block text-sm font-medium text-gray-700">Tag:</label>
            <input type="text" [(ngModel)]="newProject.tag" name="tag" required class="w-full p-2 border rounded-md">
          </div>
          <div class="mb-4">
            <label class="block text-sm font-medium text-gray-700">Approximate Cost:</label>
            <input type="number" [(ngModel)]="newProject.approximateCost" name="approximateCost" required class="w-full p-2 border rounded-md">
          </div>
          <div class="mb-4">
            <label class="block text-sm font-medium text-gray-700">Actual Cost:</label>
            <input type="number" [(ngModel)]="newProject.actualCost" name="actualCost" required class="w-full p-2 border rounded-md">
          </div>
          <!-- <div class="mb-4">
            <label class="block text-sm font-medium text-gray-700">Location:</label>
            <input type="text" [(ngModel)]="newProject.location.county" name="tag" required class="w-full p-2 border rounded-md">
          </div> -->
          <div class="mb-4">
            <label for="location" class="block text-sm font-medium text-gray-700">Location </label>
            <select
              id="location"
              [(ngModel)]="newProject.location"
              name="location"
              class="w-full p-2 border rounded-md"
            >
              <option value="" disabled selected>Select your location</option>
              <option *ngFor="let location of locations" [ngValue]="location">
                {{ location.county }}
              </option>
            </select>
          </div>
          
          <!-- Image Upload -->
          <div class="mb-4">
            <label class="block text-sm font-medium text-gray-700">Project Banner:</label>
            <input type="file" (change)="onImageUpload($event)" accept="image/*" class="w-full p-2 border rounded-md">
          </div>
          <!-- Image Preview -->
          <div *ngIf="newProject.base64EncodedImage" class="mb-4">
            <img [src]="newProject.base64EncodedImage" class="w-full max-h-48 rounded-md shadow-md object-cover" />
            <button type="button" (click)="clearImage()" class="mt-2 bg-red-500 text-white py-1 px-3 rounded-md hover:bg-red-600">
              <i class="pi pi-trash"></i> Remove Image
            </button>
          </div>
    
          <!-- Buttons -->
          <div class="flex justify-end gap-4">
            <button type="button" (click)="toggleProjectForm()" class="bg-gray-500 text-white py-2 px-4 rounded-md hover:bg-gray-600 transition-all">
              <i class="pi pi-times mr-2"></i> Cancel
            </button>
            <button type="submit" class="bg-teal-900 text-white py-2 px-4 rounded-md hover:bg-success-dark transition-all">
              <i class="pi pi-check mr-2"></i> Submit
            </button>
          </div>
        </form>
      </div>
  
      <!--project table-->
      <div class="font-[sans-serif] overflow-x-auto">
        <table value="events" class="min-w-full bg-white">
          <thead class="bg-teal-900 text-white">
            <tr>
              <th class="p-4 text-left text-sm font-semibold">
                <i class="pi pi-image mr-1"></i>Banner
              </th>
              <th class="p-4 text-left text-sm font-semibold">
                <i class="pi pi-tag mr-1"></i>Title
              </th>
              <th class="p-4 text-left text-sm font-semibold">
                <i class="pi pi-align-left mr-1"></i>Description
              </th>
              <th class="p-4 text-left text-sm font-semibold">
                <i class="pi pi-calendar mr-1"></i>days Remaining
              </th>
              <th class="p-4 text-left text-sm font-semibold">
                <i class="pi pi-info-circle mr-1"></i>Details
              </th>
            </tr>
          </thead>
          <tbody class="whitespace-nowrap divide-y divide-gray-200">
            <tr *ngFor="let project of projects">
              <td class="p-4 text-sm">
                <div class="flex items-center">
                  <img [src]="project?.base64EncodedImage || 'assests/home.jpg'" class="w-24 h-24 p-1.5 shrink-0 bg-gray-100" />
                </div>
              </td>
              <td class="p-4 text-sm text-black">
                {{ project?.title }}
              </td>
              <td class="p-4 text-sm text-black">
                {{ project?.description?.slice(0, 50) }}
              </td>
              <td class="p-4 text-sm text-black">
                {{ project?.daysRemaining}}
              </td>
              <td class="p-4 text-sm text-center">
                <button (click)="showViewEventModal(project)" class="bg-gray-500 text-white py-1 px-3 rounded-md hover:bg-gray-500">
                  <i class="pi pi-eye"></i> View
                </button>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    
      
    
      <!-- View project Modal-->
      <div *ngIf="isViewing" class="fixed inset-0 z-50 flex items-center justify-center bg-black bg-opacity-50">
        <div class="bg-white p-6 rounded-md shadow-md relative w-full max-w-3xl mx-auto">
          <div class="flex justify-between items-center mb-4">
            <h2 class="text-xl font-semibold">Projects Details</h2>
            <button (click)="closeViewEventModal()" class="text-gray-500 hover:text-gray-700">
              <i class="pi pi-times"></i>
            </button>
          </div>
          <div class="flex">
            <div class="w-2/3 pr-4">
              <div class="mb-4 flex items-center">
                <i class="pi pi-tag mr-2"></i>
                <div>
                  <label class="text-sm font-medium">Title:</label>
                  <input type="text" [(ngModel)]="selectedProject.title" class="w-full p-2 border rounded-md">
                </div>
              </div>
              <div class="mb-4 flex items-center">
                <i class="pi pi-map-marker mr-2"></i>
                <div>
                  <label class="text-sm font-medium">Location:</label>
                  <input type="text" [(ngModel)]="selectedProject.location.county" class="w-full p-2 border rounded-md">
                </div>
              </div>
              <div class="mb-4 flex items-center">
                <i class="pi pi-calendar mr-2"></i>
                <div>
                  <label class="text-sm font-medium">Days Remaining:</label>
                  <input type="number" [(ngModel)]="selectedProject.daysRemaining" class="w-full p-2 border rounded-md">
                </div>
              </div>
              <div class="mb-4 flex items-center">
                <i class="pi pi-money-bill mr-2"></i>
                <div>
                  <label class="text-sm font-medium">Approximate cost:</label>
                  <input type="number" [(ngModel)]="selectedProject.approximateCost" class="w-full p-2 border rounded-md">
                </div>
              </div>
              <div class="mb-4 flex items-center">
                <i class="pi pi-money-bill mr-2"></i>
                <div>
                  <label class="text-sm font-medium">Actual cost:</label>
                  <input type="number" [(ngModel)]="selectedProject.actualCost" class="w-full p-2 border rounded-md">
                </div>
              </div>
              <div class="mb-4 flex items-center">
                <i class="pi pi-wallet mr-2"></i>
                <div>
                  <label class="text-sm font-medium">Tag:</label>
                  <input type="text" [(ngModel)]="selectedProject.tag" class="w-full p-2 border rounded-md">
                </div>
              </div>
              <div class="mb-4 flex items-center">
                <i class="pi pi-align-left mr-2"></i>
                <div>
                  <label class="text-sm font-medium">Description:</label>
                  <textarea [(ngModel)]="selectedProject.description" class="w-full p-4 border rounded-md"></textarea>
                </div>
              </div>
            </div>
            <div class="w-1/3">
              <!-- Right column - Images -->
              <div class="mb-4">
                <label class="text-sm font-medium mb-2">Banner Image:</label>
                <img [src]="selectedProject?.base64EncodedImage || 'assets/home.png'" 
                     alt="Project Banner" 
                     class="w-full h-48 object-contain rounded-md border" />
              </div>
          
              <div class="mb-4">
                <label class="text-sm font-medium mb-2">Project Receipt:</label>
                <div *ngIf="selectedProject.base64Encoded" class="mb-2">
                  <img [src]="'data:image/jpeg;base64,' + selectedProject.base64Encoded" 
                       alt="Project Receipt" 
                       class="w-full h-48 object-contain border rounded-md" />
                  <button (click)="clearReceipt()" 
                          class="mt-2 w-full bg-red-500 hover:bg-red-600 text-white py-1 px-3 rounded-md text-sm transition">
                    <i class="pi pi-trash mr-1"></i> Remove Receipt
                  </button>
                </div>
                <div *ngIf="!selectedProject.base64Encoded" class="text-gray-500 text-sm mb-4">
                  No receipt uploaded yet
                </div>
          
                <div class="flex flex-col gap-2">
                  <input type="file" 
                         id="receiptUpload" 
                         (change)="onReceiptUpload($event)" 
                         accept="image/*" 
                         class="hidden" />
                  <label for="receiptUpload" 
                         class="bg-teal-900 hover:bg-teal-800 text-white py-2 px-4 rounded-md cursor-pointer text-center transition flex items-center justify-center">
                    <i class="pi pi-upload mr-2"></i> Upload New Receipt
                  </label>
                  <div *ngIf="newReceipt" class="text-sm text-teal-900 font-medium text-center">
                    New receipt ready to upload
                  </div>
                </div>
              </div>
            </div>
          </div>
          <div class="flex justify-end mt-4 gap-4">
            <button (click)="closeViewEventModal()" class="bg-gray-500 text-white py-2 px-4 rounded-md hover:bg-gray-600">
              <i class="pi pi-times mr-2"></i> Close
            </button>
            <button (click)="updateProject()" class="bg-gray-500 text-white py-2 px-4 rounded-md hover:bg-gray-500">
              <i class="pi pi-check mr-2"></i> Update
            </button>
            <button (click)="deleteProject()" (click)="closeViewEventModal()" class="bg-gray-500 text-white py-2 px-4 rounded-md hover:bg-gray-500">
              <i class="pi pi-trash mr-2"></i> Delete
            </button>
          </div>
        </div>
      </div> 
    </div>
