
<app-navbar class="fixed top-0 left-0 w-full z-50 bg-white shadow-md"></app-navbar>
<div class="max-w-4xl mx-auto p-6 bg-white rounded-lg shadow-lg mt-20">
    <h2 class="text-2xl font-semibold text-gray-800">{{ event?.title }}</h2>
    <img [src]="event?.base64EncodedImage" alt="Event Image" class="w-full h-64 object-cover rounded-lg mt-4">
  
    <p class="text-gray-600 mt-4"><i class="pi pi-calendar"></i> {{ event?.eventDate }} | <i class="pi pi-clock"></i> {{ event?.time }}</p>
    <p class="text-gray-600 mt-4"><i class="pi pi-map-marker"></i> {{ event?.location?.county }}</p>
    <p class="mt-4 text-gray-700">{{ event?.description }}</p>
    <p class="mt-4 text-gray-700">Attendees: {{rsvps.length}}</p>
  
    <!-- RSVP Form -->
    <div class="mt-6 bg-gray-100 p-4 rounded-lg">
      <h3 class="text-lg font-semibold text-gray-800">RSVP to this event</h3>
      <form [formGroup]="rsvpForm" (ngSubmit)="submitRsvp()">
        <div class="mb-4">
          <label class="block text-gray-700">Full Name</label>
          <input type="text" formControlName="fullName" class="w-full p-2 border border-gray-300 rounded-lg">
        </div>
        <div class="mb-4">
          <label class="block text-gray-700">Email</label>
          <input type="email" formControlName="email" class="w-full p-2 border border-gray-300 rounded-lg">
        </div>
        <button type="submit" class="bg-blue-900 text-white px-4 py-2 rounded-lg hover:bg-blue-700 transition">
          Confirm RSVP
        </button>
      </form>
    </div>
  </div>
