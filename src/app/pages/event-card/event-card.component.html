<!-- Top Divider -->
<div id="top"></div>

<div class="bg-white shadow-lg rounded-2xl p-8 border border-gray-200 hover:shadow-2xl transition flex mb-6 max-w-6xl mx-auto">
  <!-- Image Section -->
  <div class="flex-shrink-0">
    <img [src]="event.base64EncodedImage" alt="Event Banner" class="w-60 h-44 object-cover rounded-lg mr-10">
  </div>

  <!-- Separator -->
  <div class="w-px bg-gray-300 mx-6"></div>

  <!-- Event Content -->
  <div class="flex-1">
    <div class="flex items-center space-x-3 text-gray-500 text-sm">
      <span><i class="pi pi-calendar mr-1"></i> {{ event.eventDate }}</span>
      <span><i class="pi pi-clock mr-1"></i> {{ event.time }}</span>
    </div>

    <h2 class="text-lg font-semibold text-gray-800 mt-2">
      {{ event.title || 'Tech Innovation Conference 2024' }}
    </h2>

    <p class="text-gray-600 text-sm mt-2">
      <i class="pi pi-align-left mr-2"></i>{{ event.description }}
    </p>

    <div class="flex items-center space-x-2 text-sm text-gray-700 mt-3">
      <span><i class="pi pi-map-marker mr-1"></i> {{ event.location.county }}, Kenya</span>
    </div>
  </div>

  <!-- Separator -->
  <div class="w-px bg-gray-300 mx-6"></div>

  <!-- Speakers and Action Buttons -->
  <div class="flex flex-col items-end space-y-2">
    <div class="flex items-center space-x-2">
      <div class="flex items-center">
        <ng-container *ngFor="let participant of participants; let i = index">
          <img [src]="participant.avatar" 
               [alt]="'Avatar ' + (i + 1)" 
               class="h-8 w-8 rounded-full border-2 border-white -ml-2 first:ml-0" />
        </ng-container>
        <span class="text-sm text-gray-700">Speakers</span>
      </div>
    </div>

    <button class="bg-teal-900 text-white px-10 py-2 rounded-lg hover:bg-teal-700 transition" 
            [routerLink]="['/event-details', event.eventId]">
      RSVP
    </button>
  </div>
</div>
