<section class="bg-gray-100 py-12">
  <div class="max-w-screen-xl mx-auto px-4">
    <!-- Header -->
    <div class="flex justify-between items-center mb-8">
      <h2 class="text-2xl font-bold text-gray-800">{{ projectsTitle }}</h2>
      <a class="text-blue-800 hover:underline">{{ seeAllText }}</a>
    </div>

    <!-- Card Container -->
    <div class="bg-white shadow-lg rounded-lg overflow-hidden flex flex-col lg:flex-row relative">
      <!-- Image Section -->
      <div class="lg:w-1/3">
        <img [src]="project?.base64EncodedImage" [alt]="projectAlt" class="h-full w-full object-cover" />
      </div>

      <!-- Content Section -->
      <div class="p-6 lg:w-2/3 relative">
        
        <!-- Small Comment Form (Positioned Above Description) -->
        <div *ngIf="showCommentDialog" class="absolute top-2 right-2 bg-gray-100 p-3 rounded-lg shadow-lg w-72">
          <h3 class="text-sm font-semibold text-gray-800">Add a Comment</h3>
          <textarea [(ngModel)]="newComment" placeholder="Write here..." 
                    class="w-full p-1 border border-gray-300 rounded-lg text-sm mt-1"></textarea>
          <div class="flex justify-end space-x-1 mt-2">
            <button (click)="showCommentDialog = false" class="px-2 py-1 bg-gray-300 rounded-md text-xs">Cancel</button>
            <button (click)="createComment()" class="px-2 py-1 bg-blue-900 text-white rounded-md text-xs hover:bg-blue-700">
              Submit
            </button>
          </div>
        </div>

        <!-- Project Info -->
        <div class="flex justify-between items-center mb-4">
          <span class="text-sm text-gray-500">{{ project?.daysRemaining }} days remaining</span>
          <button class="bg-red-100 text-red-600 text-xs px-3 py-1 rounded-full">
            {{ project?.tag }}
          </button>
        </div>
        <h3 class="text-2xl font-semibold text-gray-800 mb-4">
          {{ project?.title }}
        </h3>

        <p class="text-gray-600 mb-6">
          {{ project?.description }}
        </p>

        <div class="flex justify-between items-center">
          <!-- Participants -->
          <div class="flex items-center space-x-2">
            <ng-container *ngFor="let participant of participants; let i = index">
              <img [src]="participant.avatar" [alt]="'Avatar ' + (i + 1)" class="h-8 w-8 rounded-full" />
            </ng-container>
            <span class="text-gray-600 text-sm">{{ additionalParticipants }}</span>
          </div>

          <!-- Actions -->
          <div class="flex space-x-6 text-gray-600">
            <!-- Likes Section -->
            <div class="flex items-center space-x-1">
              <span class="text-gray-800 font-semibold">{{ likes.length }}</span>
              <button (click)="submitLike()" type="button" mat-icon-button aria-label="Favorite">
                <mat-icon>favorite</mat-icon>
              </button>

              <span class="text-gray-800 font-semibold">{{ comments.length }}</span>
              <button mat-icon-button aria-label="Chat" (click)="toggleCommentDialog()">
                <mat-icon>chat</mat-icon>
              </button>
            </div>
          </div>
        </div>

      </div>
    </div>
  </div>
</section>
