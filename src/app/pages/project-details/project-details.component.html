<section class="bg-gray-100 py-12">
  <div class="max-w-screen-xl mx-auto px-4">
    <!-- Header -->
    <div class="flex justify-between items-center mb-8">
      <h2 class="text-2xl font-bold text-gray-800">{{ projectsTitle }}</h2>
      <a class="text-blue-800 hover:underline">{{ seeAllText }}</a>
    </div>

    <!-- Card Container -->
    <div class="bg-white shadow-lg rounded-lg overflow-hidden flex flex-col lg:flex-row">
      <!-- Image Section -->
      <div class="lg:w-1/3">
        <img [src]="project?.base64EncodedImage" [alt]="projectAlt" class="h-full w-full object-cover" />
      </div>

      <!-- Content Section -->
      <div class="p-6 lg:w-2/3">
        <div class="flex justify-between items-center mb-4">
          <span class="text-sm text-gray-500">{{ project?.daysRemaining }} days remaining</span>
          <button class="bg-red-100 text-red-600 text-xs px-3 py-1 rounded-full">
            {{ project?.tag }}
          </button>
        </div>
        <h3 class="text-2xl font-semibold text-gray-800 mb-4">
          {{ project?.title }}
        </h3>
        <p class="text-gray-600 mb-6">
          {{ project?.description }}
        </p>

        <div class="flex justify-between items-center">
          <!-- Participants -->
          <div class="flex items-center space-x-2">
            <ng-container *ngFor="let participant of participants; let i = index">
              <img [src]="participant.avatar" [alt]="'Avatar ' + (i + 1)" class="h-8 w-8 rounded-full" />
            </ng-container>
            <span class="text-gray-600 text-sm">{{ additionalParticipants }}</span>
          </div>

          <!-- Actions -->
          <div class="flex space-x-6 text-gray-600">
            <!-- Likes Section -->
            <div class="flex items-center space-x-1">
              <span class="text-gray-800 font-semibold">{{ likes.length }}</span>
              <button (click)="submitLike()" type="button" mat-icon-button aria-label="Favorite">
                <mat-icon>favorite</mat-icon>
              </button>
            </div>
            <button mat-icon-button aria-label="Chat">
              <mat-icon>chat</mat-icon>
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
